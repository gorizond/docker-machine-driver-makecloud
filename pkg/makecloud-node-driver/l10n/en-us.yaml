cluster:
  provider:
    makecloud: MakeCloud
  credential:
    makecloud:
      token:
        label: MakeCloud API token
        placeholder: xxxxxxxx...
      baseUrl:
        label: API base URL
        placeholder: https://cp.iteco.cloud
      insecureTLS:
        label: Skip TLS verification (insecure)
  machineConfig:
    makecloud:
      api:
        header: API
        token:
          label: API token
        baseUrl:
          label: API base URL
        insecureTLS:
          label: Skip TLS verification (insecure)
      vm:
        header: VM
        vdcId:
          label: VDC ID
        templateId:
          label: Template ID
        templateName:
          label: Template name
        storageProfileId:
          label: Storage profile ID
        networkId:
          label: Network ID
        floatingIp:
          label: Floating IP (address or ID)
      resources:
        header: Resources
        cpu:
          label: CPU cores
        ram:
          label: RAM (GiB)
        diskSize:
          label: Root disk size (GiB)
      ssh:
        header: SSH
        user:
          label: SSH user
        port:
          label: SSH port
      advanced:
        header: Advanced
        firewallTemplateIds:
          label: Firewall template IDs (repeatable)
          tooltip: If empty, defaults are applied (egress; WEB on floating IP)
        tags:
          label: Tags (repeatable)
        metadata:
          label: Template fields (key=value, repeatable)
        userData:
          label: Cloud-init user-data
        noInjectSshKey:
          label: Disable automatic SSH key injection
        waitTimeout:
          label: Wait timeout (seconds)
